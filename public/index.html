<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one phone-width column; onboarding wizard, then an app shell with a fixed bottom tab bar; prices as yellow shelf-edge labels */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E1; --ink:#15231B; --muted:#5B6A61; --line:#D5DDD3;
  --brand:#1C5A3C; --brand-ink:#FFFFFF; --brand-soft:#DCEBE1;
  --label:#FFD43B; --label-ink:#231C00;
  --ok:#2C8A57; --over:#C0392B; --warn-bg:#FFF4D1; --warn-ink:#5A4600;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A22; --ink:#E6EEE8; --muted:#94A399; --line:#28372E;
  --brand:#5CC08B; --brand-ink:#08170F; --brand-soft:#1E3427;
  --label:#F7CF3A; --label-ink:#1E1800; --ok:#5CC08B; --over:#F0796A; --warn-bg:#2E2810; --warn-ink:#F2DC8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A22; --ink:#E6EEE8; --muted:#94A399; --line:#28372E;
  --brand:#5CC08B; --brand-ink:#08170F; --brand-soft:#1E3427;
  --label:#F7CF3A; --label-ink:#1E1800; --ok:#5CC08B; --over:#F0796A; --warn-bg:#2E2810; --warn-ink:#F2DC8A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.app.wiz{padding-block:14px 32px}
.num{font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:12px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1;color:var(--brand)}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.where{font-size:13px;color:var(--muted);text-align:right;min-width:0}
.where b{display:block;color:var(--ink);font-weight:600}

h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
.hint{font-size:13px;color:var(--muted);margin:0}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--brand)}
.stepno{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.flabel{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flabel output{color:var(--ink);letter-spacing:0;font-size:15px;text-transform:none}
.field{display:flex;flex-direction:column;gap:8px}
.pcrow{display:flex;gap:8px}
.pcrow input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);text-transform:uppercase;font-weight:600;letter-spacing:.04em;font-size:17px}
.area{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-weight:600}
.area svg{flex:none;color:var(--brand)}
.err{color:var(--over);font-size:14px;margin:0}

.shops{display:flex;flex-direction:column;gap:8px}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--sunk);border:2px solid transparent;border-radius:14px;padding:11px 12px;cursor:pointer}
.shop[aria-checked="true"]{border-color:var(--brand);background:var(--surface)}
.shop .dot{width:20px;height:20px;border-radius:99px;border:2px solid var(--muted);display:grid;place-items:center}
.shop[aria-checked="true"] .dot{border-color:var(--brand)}
.shop[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--brand)}
.shop .sn{font-weight:700}
.shop .sd{font-size:12.5px;color:var(--muted)}
.shop a{font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{border:2px solid transparent;background:var(--sunk);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-weight:700}
.opt span{font-size:12.5px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

input[type=range]{width:100%;accent-color:var(--brand)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:10px;padding:4px}
.stepper button{width:40px;height:40px;border:0;border-radius:8px;background:var(--surface);font-size:20px;font-weight:600}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper span{font-weight:700;font-size:17px}
.switch{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--brand);flex:none}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:9px 12px;font-size:14px}
.btn.full{width:100%}
.navrow{display:flex;gap:8px}
.navrow .btn{flex:1}

.meter{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meter .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.meter .of{font-size:14px;opacity:.8}
.meter .status{font-weight:700;font-size:14px;padding:4px 10px;border-radius:99px;background:var(--label);color:var(--label-ink)}
.meter .status.over{background:var(--over);color:#fff}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--brand-ink) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--label);border-radius:99px;transition:width .4s ease}
.bar.over i{background:var(--over)}
.meter .sub{font-size:13px;opacity:.85}

.days{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day{display:grid;grid-template-columns:42px 1fr auto auto;align-items:center;gap:10px;padding:12px 10px 12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-family:var(--display);font-weight:800;font-size:15px;color:var(--brand);text-transform:uppercase}
.day .open{all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.day .open:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
.day.pending .rname{color:var(--muted)}
.skel{display:block;height:12px;border-radius:6px;background:var(--sunk);width:70%;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.rname{font-weight:600;line-height:1.25}
.rmeta{font-size:12.5px;color:var(--muted)}
.shelf{background:var(--label);color:var(--label-ink);font-weight:700;font-size:13px;padding:3px 7px 3px 8px;border-radius:3px;white-space:nowrap;line-height:1.15;text-align:right;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.shelf small{display:block;font-weight:600;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.swap{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.swap:disabled{opacity:.4;cursor:default}
.swap svg{width:18px;height:18px}
.swap.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.genbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
.genbar .pulse{width:10px;height:10px;border-radius:99px;background:var(--brand);animation:pulse 1s infinite;flex:none}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}

.aisle{display:flex;flex-direction:column;gap:6px}
.aisle h3{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item input{width:20px;height:20px;accent-color:var(--brand)}
.item .iname{font-weight:600;line-height:1.25}
.item .ipack{font-size:12.5px;color:var(--muted)}
.item .iprice{font-weight:700}
.item.done .iname,.item.done .iprice{text-decoration:line-through;opacity:.5}
.spare{color:var(--brand);font-weight:600}
.cupboard{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:12px 14px}
.cupboard b{color:var(--ink)}
.answers{display:flex;flex-direction:column}
.answers div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.answers div:first-child{border-top:0}
.answers dt{color:var(--muted)}
.answers dd{margin:0;font-weight:600;text-align:right}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
.badge{background:var(--label);color:var(--label-ink);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;margin-left:3px}

.scrim{position:fixed;inset:0;background:rgba(5,12,8,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:26px;margin:0}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{border:0;background:var(--sunk);width:36px;height:36px;border-radius:99px;font-size:18px;flex:none}
.sheet h4{margin:18px 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ings{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ings li span:last-child{color:var(--muted);white-space:nowrap}
.steps{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:9px}
.steps li::marker{font-weight:700;color:var(--brand)}
.tip{margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cal-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.cal-row>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-n{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--brand)}
.cal-l{font-size:12.5px;color:var(--muted)}
.kgroup{display:flex;flex-direction:column;gap:8px}
.kgroup h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.linkbtn{all:unset;cursor:pointer;color:var(--brand);font-weight:600;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>

</nav>

/* AI planner. Inside Claude it uses the viewer's Claude account. On your own website it calls /api/plan,
   a small server function that holds the API key. Opened as a plain file, it uses the built-in recipes. */
const AI_ENDPOINT='/api/plan';
let aiVia=null;
async function siteText(prompt,{signal,onText,kind}={}){
  let res;
  try{res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,prompt}),signal})}
  catch(e){throw {code:signal&&signal.aborted?'cancelled':'upstream_error'}}
  if(!res.ok)throw {code:res.status===429?'rate_limited':(res.status===404||res.status===405)?'no_backend':res.status===503?'not_configured':'upstream_error'};
  const reader=res.body.getReader(),dec=new TextDecoder();let text='';
  try{for(;;){const {done,value}=await reader.read();if(done)break;const delta=dec.decode(value,{stream:true});if(!delta)continue;text+=delta;onText&&onText({text,delta})}}
  catch(e){throw {code:signal&&signal.aborted?'cancelled':'upstream_error',text}}
  if(!text.trim())throw {code:'empty_completion'};
  return text}
function parseJson(t){try{return JSON.parse(t)}catch(e){}const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw {code:'invalid_json'}}
const aiP=(async()=>{
  if(window.claude&&window.claude.use){const s=await window.claude.use('sample').catch(()=>null);if(!s)return null;aiVia='claude';
    return {text:(p,{kind,...o}={})=>s(p,Object.assign({cache:false},o)).then(r=>r.text),json:(p,{kind,...o}={})=>s.json(p,Object.assign({cache:false},o))}}
  if(/^https?:$/.test(location.protocol)){aiVia='site';return {text:siteText,json:async(p,o)=>parseJson(await siteText(p,o))}}
  return null})();

function frac(x){const w=Math.floor(x+1e-9),f=x-w;const m={0.25:'¼',0.5:'½',0.75:'¾'};if(Math.abs(f)<.01)return String(w);const k=Object.keys(m).find(k=>Math.abs(f-k)<.04);if(k)return (w||'')+m[k];return (Math.round(x*10)/10).toString()}
function qtyLabel(id,q){const g=ING[id];if(g.u){const r=q>=100?Math.round(q/5)*5:Math.round(q);return r+g.u}const t=frac(q);return t+' '+g.c+(q>1.01?'s':'')}
function packLabel(g){if(g.u)return g.s>=1000?(g.s/1000)+(g.u==='g'?'kg':'L'):g.s+g.u;return g.s+' '+g.c+(g.s>1?'s':'')}
function portionCost(meal){return meal.i.reduce((t,[id,q])=>{const g=ING[id];if(!g||have(id))return t;return t+q*price(id)/g.s},0)}
function kcalOf(meal){return meal.i.reduce((t,[id,q])=>{const g=ING[id];if(!g)return t;return t+q*(g.u?g.k/100:g.k)},0)}

function listFor(ents){
  const need={};ents.forEach(([m,ppl])=>m.i.forEach(([id,q])=>{if(ING[id])need[id]=(need[id]||0)+q*ppl}));
  const items=[],kitchen=[];let total=0;
  for(const id in need){const g=ING[id];if(have(id)){kitchen.push(id);continue}
    const packs=Math.max(1,Math.ceil(need[id]/g.s-1e-6));const cost=Math.round(packs*price(id)*100)/100;total+=cost;
    items.push({id,qty:need[id],packs,cost,spare:packs*g.s-need[id]})}
  return {items,kitchen,total}
}
const totalFor=ents=>listFor(ents).total;

const INDIAN=/\b(curr(y|ies)|dh?aa?l|masala|tikka|korma|biryani|bhajis?|tandoori|balti|madras|vindaloo|jalfrezi|saag|paneer|naan|samosas?|pakoras?|rogan josh|bhuna|dopiaza|garam|chapatis?|roti|raita|chutney|pilau|keema|aloo|chana|gobi|makhani|turmeric|indian)\b/i;

function flagsOf(ids){const f=new Set();ids.forEach(id=>(ING[id]?.f||'').split(' ').filter(Boolean).forEach(x=>f.add(x)));return f}
function blocked(){const b=new Set(S.avoid.filter(a=>a!=='spicy'));
  if(S.diet==='veggie'){b.add('meat');b.add('fish')}
  if(S.diet==='vegan'){['meat','fish','dairy','egg'].forEach(x=>b.add(x))}
  if(S.diet==='pesc')b.add('meat');
  if(S.diet==='halal')b.add('pork');
  return b}
function adapt(recipe){
  const b=blocked();let i=recipe.i.map(x=>x.slice());
  if(b.has('gluten'))i=i.map(([id,q])=>[(id==='pasta'||id==='spaghetti')?'gfpasta':id,q]);
  if(b.has('dairy')){i=i.map(([id,q])=>[id==='milk'?'oatmilk':id==='butter'?'oil':id,q]).filter(([id])=>!['cheddar','yogurt','mozzarella'].includes(id))}
  return Object.assign({},recipe,{i})
}
function fits(meal){const b=blocked();const f=flagsOf(meal.i.map(x=>x[0]));for(const x of b)if(f.has(x))return false;
  if(meal.dc&&b.has('dairy'))return false;
  if(S.avoid.includes('spicy')&&meal.hot)return false;
  return !isIndian(meal)}
function libPool(){return LIB.map(adapt).filter(m=>fits(m)&&m.m<=Math.max(S.maxMins,30)+25)}
function lunchPool(){return LUNCH.map(r=>adapt(Object.assign({lunch:1},r))).filter(m=>fits(m)&&m.i.length>=2)}

/* ---------- built-in planner ---------- */
function fixMix(list){const fishOk=!S.avoid.includes('fish'),porkOk=!S.avoid.includes('pork')&&S.diet==='any';
  return list.map(k=>k==='pork'&&!porkOk?'meat':k==='fish'&&!fishOk?(S.diet==='pesc'?'veg':'meat'):k)}
function mix(n){
  const M={any:['meat','fish','meat','pork','veg','meat','fish'],halal:['meat','fish','meat','veg','meat','fish','meat'],
    pesc:['fish','veg','fish','vegan','fish','veg','fish'],veggie:['veg','vegan','veg','veg','vegan','veg','vegan'],vegan:Array(7).fill('vegan')}[S.diet]||[];
  let out=fixMix(M.slice(0,n));
  if(S.goal==='cheap'&&(S.diet==='any'||S.diet==='halal')){const i=out.lastIndexOf('meat');if(i>-1&&out.filter(k=>k==='meat').length>2)out[i]='veg'}
  if(S.goal==='protein'&&S.diet==='any'){const i=out.indexOf('veg');if(i>-1)out[i]='meat'}
  return out}
function lunchMix(n){
  const M={any:['meat','fish','veg','pork','vegan','meat','veg'],halal:['meat','fish','veg','meat','vegan','fish','veg'],
    pesc:['fish','veg','vegan','fish','veg','fish','vegan'],veggie:['veg','vegan','veg','veg','vegan','veg','vegan'],vegan:Array(7).fill('vegan')}[S.diet]||[];
  return fixMix(M.slice(0,n))}
function mainOf(m){const p=['mince','chicken','thighs','sausage','bacon','ham','cchicken','salmon','prawns','whitefish','fishf','tuna','pmince','vsausage','tofu','eggs','chickpea','kidney','beans','houmous','mozzarella','mushroom','cheddar'];return (m.i.find(([id])=>p.includes(id))||['veg'])[0]}
function libScore(base,m,ppl){
  ppl=ppl||S.people;const ents=base.map(x=>[x,ppl]);
  let c=(totalFor([...ents,[m,ppl]])-totalFor(ents))*(S.goal==='cheap'?0.7:0.3);
  c+=base.filter(x=>mainOf(x)===mainOf(m)).length*2;
  const dish=x=>x.n.toLowerCase().split(' ').pop();if(base.some(x=>dish(x)===dish(m)))c+=3;
  c-=m.i.filter(([id])=>have(id)&&!ING[id].st).length*1.5;
  if(S.goal==='family'&&m.hot)c+=4;
  if(S.goal==='healthy')c-=m.i.filter(([id])=>ING[id]&&ING[id].a==='veg').length*0.3;
  if(S.goal==='light'){const k=kcalOf(m);if(k>(m.lunch?450:600))c+=(k-(m.lunch?450:600))/60}
  return c+Math.random()*1.6}
function pickFrom(pool,want,base,ppl){
  const k=want.shift();let opts=pool.filter(m=>m.k===k);
  if(!opts.length&&k==='veg')opts=pool.filter(m=>m.k==='vegan');
  if(!opts.length)opts=pool;
  const sc=new Map(pool.map(m=>[m,libScore(base,m,ppl)]));
  opts.sort((a,b)=>sc.get(a)-sc.get(b));let pick=opts[0];
  if(sc.get(pick)>=3&&(k==='veg'||k==='vegan')&&S.diet!=='vegan'&&S.diet!=='veggie'){const best=[...pool].sort((a,b)=>sc.get(a)-sc.get(b))[0];if(sc.get(best)<sc.get(pick)-2)pick=best}
  pool.splice(pool.indexOf(pick),1);return pick}
function libFill(plan,count){
  const pool=libPool().filter(m=>!plan.some(p=>p&&p.n===m.n));
  const want=mix(count);plan.forEach(p=>{const i=p?want.indexOf(p.k):-1;if(i>-1)want.splice(i,1)});
  for(let i=0;i<count&&pool.length;i++){if(plan[i])continue;plan[i]=Object.assign({src:'lib'},pickFrom(pool,want,plan.filter(Boolean)))}
  for(let i=1;i<plan.length;i++)if(plan[i]&&plan[i-1]&&plan[i].k===plan[i-1].k&&plan[i].src==='lib'){const j=plan.findIndex((p,x)=>x>i&&p&&p.k!==plan[i].k&&p.src==='lib');if(j>-1)[plan[i],plan[j]]=[plan[j],plan[i]]}
  return plan}
function lunchFill(lunches,count){
  if(S.leftovers){let used=lunches.filter(l=>l&&l.left!=null).length;
    for(let d=1;d<count&&used<2;d++){if(lunches[d])continue;const dn=S.plan[d-1];if(dn&&KEEPS.has(dn.n)&&!lunches.some(l=>l&&l.left===d-1)){lunches[d]={left:d-1};used++;d++}}}
  const pool=lunchPool().filter(m=>!lunches.some(l=>l&&l.n===m.n));
  const want=lunchMix(count);lunches.forEach(l=>{const i=l&&l.k?want.indexOf(l.k):-1;if(i>-1)want.splice(i,1)});
  for(let i=0;i<count&&pool.length;i++){if(lunches[i])continue;if(!want.length)want.push(...lunchMix(count));
    lunches[i]=Object.assign({src:'lib',lunch:1},pickFrom(pool,want,lunches.filter(l=>l&&!l.left&&l.left!==0),S.lunchPeople))}
  return lunches}

function kindOf(i){const f=flagsOf(i.map(x=>x[0]));if(f.has('pork'))return 'pork';if(f.has('meat'))return 'meat';if(f.has('fish'))return 'fish';if(f.has('dairy')||f.has('egg'))return 'veg';return 'vegan'}
function clean(o,isLunch){

function jsonLines(t){return t.split('\n').map(x=>x.trim()).filter(x=>x.startsWith('{')).map(x=>{try{return JSON.parse(x)}catch(e){return null}}).filter(Boolean)}
async function planStaged(ai,ctl){
  const L=S.lunchOn?S.lunchDays:0;OUT={d:[],l:[]};
  let txt;try{txt=await ai.text(outlinePrompt(),{kind:'plan',signal:ctl.signal})}
  catch(e){OUT={d:[],l:[]};if(e&&e.code!=='cancelled')toast(errCopy(e&&e.code));fillGaps();S.src='lib';return}
  let dn=0,ln=0;
  jsonLines(txt).forEach(o=>{
    const isL=o.slot==='lunch';
    if(!isL&&dn<S.nights&&o.name){OUT.d[dn++]=String(o.name).slice(0,70)}
    else if(isL&&ln<L){
      if(o.leftover&&S.leftovers&&ln>0&&!S.lunches.some(l=>l&&l.left===ln-1)){S.lunches[ln]={left:ln-1};ln++}
      else if(o.name){OUT.l[ln++]=String(o.name).slice(0,70)}}});
  OUT.d=OUT.d.map(n=>n&&isIndian({n})?null:n);OUT.l=OUT.l.map(n=>n&&isIndian({n})?null:n);
  render();
  const jobs=[];const dItems=OUT.d.map((name,i)=>name&&{slot:'dinner',i,name}).filter(Boolean);
  const lItems=OUT.l.map((name,i)=>name&&!S.lunches[i]&&{slot:'lunch',i,name}).filter(Boolean);
  /* one recipe per call: each takes around 15 seconds, and the server stops at 30 */
  dItems.concat(lItems).forEach(x=>jobs.push([x]));
  let failed=0,lastErr=null;
  await Promise.all(jobs.map(async items=>{
    try{const t=await ai.text(recipePrompt(items),{kind:'plan',signal:ctl.signal});
      const got=jsonLines(t);
      items.forEach((x,j)=>{const m=clean(got[j],x.slot==='lunch');if(!m){failed++;return}
        if(x.slot==='dinner')S.plan[x.i]=m;else S.lunches[x.i]=m});
      render()}
    catch(e){failed+=items.length;lastErr=e}}));
  if(lastErr&&lastErr.code==='cancelled'){OUT={d:[],l:[]};fillGaps();S.src=S.plan.some(m=>m&&m.src==='ai')?'ai':'lib';return}
  OUT={d:[],l:[]};
  const any=S.plan.some(m=>m&&m.src==='ai');
  for(let i=0;i<S.nights;i++)if(!S.plan[i])S.plan[i]=undefined;
  S.lunches=S.lunches.map(l=>l&&l.left!=null&&!S.plan[l.left]?null:l);
  fillGaps();S.src=any?'ai':'lib';
  if(failed&&any)toast('Topped up with a couple of Scran recipes');else if(!any)toast(errCopy(lastErr&&lastErr.code))
}

    if(isL){if(ln>=L)return;
      if(o.leftover!=null){const j=Number(o.leftover)-1;if(S.leftovers&&S.plan[j]&&j+1===ln&&!S.lunches.some(l=>l&&l.left===j)){S.lunches[ln++]={left:j};render()}else{S.lunches[ln++]=null}return}
      const m=clean(o,true);S.lunches[ln++]=m||null;render();return}
    if(dn>=S.nights)return;const m=clean(o,false);if(m){S.plan[dn++]=m;render()}};
  try{
    await ai.text(planPrompt(),{kind:'plan',signal:ctl.signal,onText:({delta})=>{const ls=(pending+delta).split('\n');pending=ls.pop();ls.forEach(eat)}});
    eat(pending);S.src='ai';
    const short=S.plan.filter(Boolean).length<S.nights||(L&&S.lunches.filter(Boolean).length<L);
    fillGaps();if(short)toast('Topped up with a couple of Scran recipes');
  }catch(e){
    if(e&&e.code!=='cancelled')toast(errCopy(e&&e.code));
    fillGaps();S.src=S.plan.some(m=>m.src==='ai')?'ai':'lib';
  }
  finish();
}
function finish(){busy=null;save();render()}

async function swapDinner(idx){
  if(busy)return;const ctl=new AbortController();busy={ctl,swapping:'d'+idx};render();
  const ai=await aiP;let m=null;
  if(ai){try{m=clean(await ai.json(swapPrompt(idx),{kind:'swap',signal:ctl.signal}))}catch(e){if(e&&e.code!=='cancelled')toast(errCopy(e&&e.code))}
    if(m&&S.plan.some((p,j)=>j!==idx&&p.n.toLowerCase()===m.n.toLowerCase()))m=null}
  if(!m){const others=S.plan.filter((_,j)=>j!==idx);const all=libPool().filter(x=>!S.plan.some(p=>p.n===x.n));
    const same=all.filter(x=>x.k===S.plan[idx].k);const pool=same.length?same:all;
    if(pool.length){pool.sort((a,b)=>libScore(others,a)-libScore(others,b));m=Object.assign({src:'lib'},pool[Math.floor(Math.random()*Math.min(3,pool.length))])}}
  if(m){S.plan[idx]=m;
    /* leftover lunches only make sense from dinners that keep */
    if(!KEEPS.has(m.n)&&m.src==='lib')extraFor(idx).forEach(li=>{S.lunches[li]=null});
    if(S.lunchOn)lunchFill(S.lunches,S.lunchDays);
    toast(DAYS[idx]+' dinner: '+m.n)}else toast('No other meals fit your answers');
  finish();
}
function swapLunch(idx){
  if(busy)return;const cur=S.lunches[idx];
  const others=S.lunches.filter((l,j)=>j!==idx&&l&&l.left==null);
  const all=lunchPool().filter(x=>!S.lunches.some(l=>l&&l.n===x.n));
  const same=cur&&cur.k?all.filter(x=>x.k===cur.k):[];const pool=same.length?same:all;
  if(!pool.length){toast('No other lunches fit your answers');return}
  pool.sort((a,b)=>libScore(others,a,S.lunchPeople)-libScore(others,b,S.lunchPeople));
  const m=Object.assign({src:'lib',lunch:1},pool[Math.floor(Math.random()*Math.min(3,pool.length))]);
  S.lunches[idx]=m;save();render();toast(DAYS[idx]+' lunch: '+m.n)
}

let SECMAP=null;
function sectorMap(){if(SECMAP)return SECMAP;SECMAP=new Map();SECT.s.split(';').forEach(r=>{const [k,la,ln,t]=r.split(',');SECMAP.set(k,[+la,+ln,SECT.t[+t]])});return SECMAP}
function lookup(raw){
  const pc=raw.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^[A-Z]{1,2}[0-9][A-Z0-9]?([0-9][A-Z]{2})?$/.test(pc))return null;
  const full=/[0-9][A-Z]{2}$/.test(pc)&&pc.length>=5;
  const out=full?pc.slice(0,-3):pc, sec=full?pc.slice(-3,-2):null;
  const map=sectorMap();
  if(sec&&map.has(out+sec)){const [la,ln,town]=map.get(out+sec);return {pc:out+' '+pc.slice(-3),label:out+' '+sec,town,la,ln}}
  const hits=[...map.entries()].filter(([k])=>k.slice(0,-1)===out);
  if(!hits.length)return null;
  const towns={};hits.forEach(([,v])=>towns[v[2]]=(towns[v[2]]||0)+1);
  const town=Object.entries(towns).sort((a,b)=>b[1]-a[1])[0][0];
  return {pc:full?out+' '+pc.slice(-3):out,label:out,town,la:hits.reduce((t,h)=>t+h[1][0],0)/hits.length,ln:hits.reduce((t,h)=>t+h[1][1],0)/hits.length}
}

      <button class="btn ghost full" data-open="d${l.left}">See ${DAYNAMES[l.left]}'s recipe</button>`;
      document.getElementById('sheetHost').innerHTML=sheetWrap(html);document.getElementById('closeSheet').focus();return}
    m=l;html=`<div class="sheet-top"><div><h2 id="sheetTitle">${esc(m.n)}</h2><p class="hint num">${DAYNAMES[i]} lunch · ${m.m} min · ${fmtK(kcalOf(m))} kcal · ${gbp(portionCost(m))} a portion</p></div><button class="x" id="closeSheet" type="button" aria-label="Close">✕</button></div>
    <h4>Ingredients for ${S.lunchPeople}</h4>${ingList(m,S.lunchPeople)}`}
  html+=`<h4>Method</h4><ol class="steps">${m.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${m.note?`<p class="note tip">${esc(m.note)}</p>`:''}
   <p class="hint" style="margin-top:14px">Season with salt and pepper as you go. Calories are per portion.${m.src==='ai'?' Recipe written by AI for your answers.':''}</p>`;
  document.getElementById('sheetHost').innerHTML=sheetWrap(html);document.getElementById('closeSheet').focus();
}
const sheetWrap=h=>`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div>${h}</div></div>`;
function closeSheet(){document.getElementById('sheetHost').innerHTML=''}
let tt;function toast(m){const h=document.getElementById('toastHost');h.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>h.innerHTML='',2600)}
function listText(){const L=listFor(entries());let out=`Shopping list for ${shop().n} (about ${gbp(L.total)})\n`;
  Object.keys(AISLES).forEach(a=>{const it=L.items.filter(x=>ING[x.id].a===a&&!S.checked[x.id]);if(!it.length)return;out+=`\n${AISLES[a]}\n`+it.map(x=>`- ${ING[x.id].n} x${x.packs}`).join('\n')+'\n'});return out}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'List copied':'Copy was blocked here')}

/* ---------- events ---------- */
document.addEventListener('submit',e=>{if(e.target.id!=='pcForm')return;e.preventDefault();
  const v=document.getElementById('pc').value;S.pc=v;const a=lookup(v);
  if(!a){S.area=null;pcErr='We couldn\'t find that postcode. Check it and try again, like NP18 1AB.'}else{S.area=a;pcErr=''}
  save();render()});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]'))return;
  if(e.target.id==='scrim'){closeSheet();return}
  const t=e.target.closest('button,[data-shop]');if(!t)return;
  const d=t.dataset;
  if(t.id==='closeSheet')closeSheet();
  else if(d.shop){S.shop=d.shop;save();render()}
  else if(d.next){S.step++;save();render();window.scrollTo(0,0)}
  else if(d.back){S.step--;save();render();window.scrollTo(0,0)}
  else if(d.diet){S.diet=d.diet;save();render()}
  else if(d.avoid){const k=d.avoid;S.avoid=S.avoid.includes(k)?S.avoid.filter(x=>x!==k):[...S.avoid,k];save();render()}
  else if(d.goal){S.goal=d.goal;save();render()}
  else if(d.time){S.maxMins=+d.time;save();render()}
  else if(d.have){const k=d.have,on=!have(k);S.pantry=on?[...S.pantry,k]:S.pantry.filter(x=>x!==k);t.setAttribute('aria-pressed',on);
    const o=document.querySelector('label[for="kq"] output');if(o)o.textContent=S.pantry.length+' ticked';save();
    if(S.done){const n=listFor(entries()).items.filter(x=>!S.checked[x.id]).length;document.getElementById('shopBadge').textContent=n?n:''}}
  else if(d.step){const k=d.step,lim={people:[1,8],nights:[3,7],lunchDays:[3,7],lunchPeople:[1,8]}[k];
    const before=S[k];S[k]=Math.min(lim[1],Math.max(lim[0],S[k]+(+d.d)));
    if(k==='people'&&S.lunchPeople===before)S.lunchPeople=S[k];
    if(k==='nights'&&S.plan.length>S.nights)S.plan=S.plan.slice(0,S.nights);
    if(k==='nights'||k==='lunchDays'){if(S.done&&!busy){S.lunches=S.lunches.map(l=>l&&l.left!=null&&!S.plan[l.left]?null:l);fillGaps()}}
    save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(t.id==='go'){S.done=true;S.tab='week';save();generate();window.scrollTo(0,0)}
  else if(d.tab){S.tab=d.tab;save();render();window.scrollTo(0,0)}
  else if(d.open!==undefined)openSheet(d.open);
  else if(d.swap!==undefined){d.swap[0]==='d'?swapDinner(+d.swap.slice(1)):swapLunch(+d.swap.slice(1))}
  else if(t.id==='regen')generate();
  else if(t.id==='stop'){busy&&busy.ctl.abort()}
  else if(t.id==='redo'){S.done=false;S.step=0;save();render();window.scrollTo(0,0)}
  else if(t.id==='copy'){const txt=listText();try{navigator.clipboard.writeText(txt).then(()=>toast('List copied')).catch(()=>fallbackCopy(txt))}catch(err){fallbackCopy(txt)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  const s=e.target.closest&&e.target.closest('[data-shop]');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.shop=s.dataset.shop;save();render();document.querySelector(`[data-shop="${S.shop}"]`)?.focus()}});
document.addEventListener('input',e=>{
  if(e.target.id==='budget'){S.budget=+e.target.value;document.getElementById('budgetOut').textContent='£'+S.budget;save()}
  if(e.target.id==='kq'){const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('[data-have]').forEach(c=>{c.hidden=!!q&&!c.dataset.name.includes(q)});
    document.querySelectorAll('.kgroup').forEach(g=>{g.hidden=![...g.querySelectorAll('[data-have]')].some(c=>!c.hidden)})}
});
document.addEventListener('change',e=>{
  const y=window.scrollY;
  if(e.target.id==='budget')render();
  if(e.target.id==='lunchOn'){S.lunchOn=e.target.checked;if(S.lunchOn&&S.done&&!busy)fillGaps();save();render()}
  if(e.target.id==='leftovers'){S.leftovers=e.target.checked;if(S.done&&!busy){S.lunches=S.lunches.map(l=>l&&l.left!=null?null:l);if(!S.leftovers)S.lunches=S.lunches.map(l=>l||null);fillGaps()}save();render()}
  if(e.target.dataset&&e.target.dataset.check){S.checked[e.target.dataset.check]=e.target.checked;save();render()}
  window.scrollTo(0,y);
});

S.plan=S.plan.filter(Boolean);
if(S.plan.some(m=>isIndian(m)||!m.k)){S.plan=[];S.lunches=[];S.checked={}}
if(S.done&&(!S.plan.length||(S.lunchOn&&S.lunches.slice(0,S.lunchDays).filter(Boolean).length<S.lunchDays))){fillGaps();if(!S.src)S.src='lib';save()}
render();

</script>
</body>
</html>
